<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas Saya - E-Tugas</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div class="dashboard">
<aside class="sidebar">
    <div class="brand"> E-<span>Tugas</span></div>
    <nav>
        <a href="#" onclick="window.location.href='mahasiswa-dashboard.html'" class="active">
            <i class="fas fa-chart-pie"></i> Dashboard
        </a>
        <a href="#" onclick="window.location.href='mahasiswa-tugas.html'">
            <i class="fas fa-tasks"></i> Tugas Saya
        </a>
        <a href="#" onclick="window.location.href='mahasiswa-nilai.html'">
            <i class="fas fa-graduation-cap"></i> Nilai
        </a>
        <a href="#" onclick="window.location.href='mahasiswa-kelas.html'">
            <i class="fas fa-book"></i> Kelas Saya
        </a>
        <a href="#" onclick="logout()">
            <i class="fas fa-sign-out-alt"></i> Logout
        </a>
    </nav>
</aside>
        <main class="main-content">
            <header class="topbar">
                <h2> Tugas Saya</h2>
                <div class="user-info">
                    <span id="mhsName">Mahasiswa</span>
                    <div class="avatar" id="mhsAvatar">M</div>
                </div>
            </header>

<!-- FILTER -->
<div style="display: flex; gap: 0.5rem; align-items: center; margin-bottom: 1rem; flex-wrap: wrap;">
    <div class="form-group" style="margin-bottom: 0;">
        <select id="filterKelas" class="form-control" style="width: auto; min-width: 120px; padding: 0.25rem 0.5rem; font-size: 0.8rem;" onchange="applyFilter()">
            <option value="all">📚 Semua Kelas</option>
        </select>
    </div>
    <div class="form-group" style="margin-bottom: 0;">
        <select id="filterStatus" class="form-control" style="width: auto; min-width: 120px; padding: 0.25rem 0.5rem; font-size: 0.8rem;" onchange="applyFilter()">
            <option value="all">📋 Semua Status</option>
            <option value="sudah">✅ Sudah</option>
            <option value="belum">⏳ Belum</option>
        </select>
    </div>
    <button class="btn btn-outline btn-sm" onclick="resetFilter()" style="padding: 0.25rem 0.75rem; font-size: 0.75rem;">🔄 Reset</button>
    <span id="totalTugasFilter" style="color: var(--gray-500); font-size: 0.75rem;"></span>
</div>

            <!-- TABEL TUGAS -->
            <div class="card">
                <div class="table-container">
                    <table class="table" id="tugasTable">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Judul Tugas</th>
                                <th>Kelas</th>
                                <th>Dosen</th>
                                <th>Deadline</th>
                                <th>Status</th>
                                <th>Nilai</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="tugasTableBody">
                            <tr><td colspan="8" class="text-center">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/mahasiswa-tugas.js"></script>
</body>
</html>
