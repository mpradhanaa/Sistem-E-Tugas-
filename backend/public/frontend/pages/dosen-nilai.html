<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nilai - E-Tugas</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <div class="dashboard">
        <aside class="sidebar">
            <div class="brand">📚 E-<span>Tugas</span></div>
            <nav>
                <a href="#" onclick="window.location.href='dosen-dashboard.html'">📊 Dashboard</a>
                <a href="#" onclick="window.location.href='dosen-kelas.html'">📚 Kelas Saya</a>
                <a href="#" onclick="showBukaKelas()">✏️ Buka Kelas</a>
                <a href="#" class="active">📝 Nilai</a>
                <a href="#" onclick="logout()">🚪 Logout</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <h2>📝 Penilaian Tugas</h2>
                <div class="user-info">
                    <span id="dosenName">Dosen</span>
                    <div class="avatar" id="dosenAvatar">D</div>
                </div>
            </header>

            <!-- DAFTAR TUGAS -->
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">📋 Daftar Tugas</h3>
                </div>
                <div class="table-container">
                    <!-- FILTER KELAS -->
<div style="display: flex; gap: 1rem; align-items: center; margin-bottom: 1rem; flex-wrap: wrap;">
    <div class="form-group" style="margin-bottom: 0;">
        <label style="font-weight: 600; margin-right: 0.5rem;">📂 Filter Kelas:</label>
        <select id="filterKelas" class="form-control" style="width: auto; min-width: 200px; display: inline-block;" onchange="applyFilterKelas()">
            <option value="all">📚 Semua Kelas</option>
        </select>
    </div>
    <span id="totalTugasFilter" style="color: var(--gray-500); font-size: 0.875rem;"></span>
</div>
                    <table class="table" id="tugasTable">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Judul Tugas</th>
                                <th>Kelas</th>
                                <th>Deadline</th>
                                <th>Terkumpul</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="tugasTableBody">
                            <tr><td colspan="6" class="text-center">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- MODAL NILAI -->
<!-- MODAL NILAI -->
<div class="modal-overlay" id="nilaiModal">
    <div class="modal" style="max-width: 900px; width: 95%;">
        <h3 class="modal-title">✏️ Beri Nilai</h3>
        <div id="nilaiMahasiswaList" style="overflow-x: auto;">
            <p>Loading...</p>
        </div>
        <div style="margin-top: 1rem; text-align: right;">
            <button class="btn btn-outline" onclick="window.location.href='dosen-nilai.html'">Tutup</button>
        </div>
    </div>
</div>

    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/dosen-nilai.js"></script>
</body>
</html>
