<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nilai - E-Tugas</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div class="dashboard">
<aside class="sidebar">
    <div class="brand"> E-<span>Tugas</span></div>
    <nav>
        <a href="#" onclick="window.location.href='dosen-dashboard.html'" class="active">
            <i class="fas fa-chart-pie"></i> Dashboard
        </a>
        <a href="#" onclick="window.location.href='dosen-kelas.html'">
            <i class="fas fa-book"></i> Kelas Saya
        </a>
        <a href="#" onclick="showBukaKelas()">
            <i class="fas fa-pen"></i> Buka Kelas
        </a>
        <a href="#" onclick="window.location.href='dosen-nilai.html'">
            <i class="fas fa-clipboard-list"></i> Nilai
        </a>
        <a href="#" onclick="showChangePassword()">
            <i class="fas fa-key"></i> Ubah Password
        </a>
        <a href="#" onclick="logout()">
            <i class="fas fa-sign-out-alt"></i> Logout
        </a>
    </nav>
</aside>

        <main class="main-content">
            <header class="topbar">
                <h2>📝 Penilaian Tugas</h2>
                <div class="user-info">
                    <span id="dosenName">Dosen</span>
                    <div class="avatar" id="dosenAvatar">D</div>
                </div>
            </header>

            <!-- DAFTAR TUGAS -->
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">📋 Daftar Tugas</h3>
                </div>
                <div class="table-container">
                    <!-- FILTER KELAS -->
<div style="display: flex; gap: 1rem; align-items: center; margin-bottom: 1rem; flex-wrap: wrap;">
    <div class="form-group" style="margin-bottom: 0;">
        <label style="font-weight: 600; margin-right: 0.5rem;">📂 Filter Kelas:</label>
        <select id="filterKelas" class="form-control" style="width: auto; min-width: 200px; display: inline-block;" onchange="applyFilterKelas()">
            <option value="all">📚 Semua Kelas</option>
        </select>
    </div>
    <span id="totalTugasFilter" style="color: var(--gray-500); font-size: 0.875rem;"></span>
</div>
                    <table class="table" id="tugasTable">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Judul Tugas</th>
                                <th>Kelas</th>
                                <th>Deadline</th>
                                <th>Terkumpul</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="tugasTableBody">
                            <tr><td colspan="6" class="text-center">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- MODAL NILAI -->
<!-- MODAL NILAI -->
<div class="modal-overlay" id="nilaiModal">
    <div class="modal" style="max-width: 900px; width: 95%;">
        <h3 class="modal-title">✏️ Beri Nilai</h3>
        <div id="nilaiMahasiswaList" style="overflow-x: auto;">
            <p>Loading...</p>
        </div>
        <div style="margin-top: 1rem; text-align: right;">
            <button class="btn btn-outline" onclick="window.location.href='dosen-nilai.html'">Tutup</button>
        </div>
    </div>
</div>

    <!-- MODAL UBAH PASSWORD -->
<div class="modal-overlay" id="passwordModal">
    <div class="modal" style="max-width: 400px;">
        <h3 class="modal-title">🔑 Ubah Password</h3>
        <form id="passwordForm">
            <div class="form-group">
                <label for="oldPassword">Password Lama</label>
                <input type="password" id="oldPassword" class="form-control" placeholder="Masukkan password lama" required>
            </div>
            <div class="form-group">
                <label for="newPassword">Password Baru</label>
                <input type="password" id="newPassword" class="form-control" placeholder="Minimal 6 karakter" required>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Konfirmasi Password Baru</label>
                <input type="password" id="confirmPassword" class="form-control" placeholder="Ulangi password baru" required>
            </div>
            <div id="passwordMessage" class="error" style="margin-top: 0.5rem; display: none;"></div>
            <div class="modal-actions">
                <button type="submit" class="btn btn-primary" id="savePasswordBtn"> Simpan</button>
                <button type="button" class="btn btn-outline" onclick="closePasswordModal()">Batal</button>
            </div>
        </form>
    </div>
</div>

    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/dosen-nilai.js"></script>
</body>
</html>
