<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - E-Tugas</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <div class="logo">
                <h1>📚 E-<span>Tugas</span></h1>
                <p>Portal Tugas Mahasiswa</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username (NPM / Kode Dosen)</label>
                    <input type="text" id="username" class="form-control" placeholder="Masukkan username" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Masukkan password" required>
                </div>

                <button type="submit" class="btn btn-primary btn-login">🔐 Login</button>
                <div id="errorMessage" class="error-msg"></div>
            </form>

            <div style="margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--gray-200);">
                <p style="font-size: 0.75rem; color: var(--gray-400); text-align: center;">
                
                </p>
            </div>
        </div>
    </div>

    <script src="/frontend/assets/js/auth.js?v=2"></script>
</body>
</html>
