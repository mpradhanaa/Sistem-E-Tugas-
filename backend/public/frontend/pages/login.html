<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - E-Tugas</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <div class="login-page">
        <div class="login-container">
            <!-- Left Side - Info Card -->
            <div class="login-info">
                <div class="info-content">
                    <h1 class="info-title">Selamat Datang di <br>Portal Tugas Mahasiswa</h1>
                    <p class="info-desc">
                        Platform manajemen tugas online untuk mahasiswa dan dosen. 
                        Kelola tugas, kumpulkan file, dan pantau nilai dengan mudah.
                    </p>
                </div>
            </div>

            <!-- Right Side - Login Form -->
            <div class="login-card">
                <div class="logo">
                    <h1>📚 E-<span>Tugas</span></h1>
                    <p>Sign In ke Akun Anda</p>
                </div>

                <form id="loginForm">
                    <div class="form-group">
                        <label for="username">
                            <span class="label-icon"></span> Username
                        </label>
                        <input 
                            type="text" 
                            id="username" 
                            class="form-control" 
                            placeholder="Masukkan username Anda" 
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="password">
                            <span class="label-icon"></span> Password
                        </label>
                        <input 
                            type="password" 
                            id="password" 
                            class="form-control" 
                            placeholder="Masukkan password Anda" 
                            required
                        >
                    </div>

                    <!-- Form Actions: Checkbox + Button sejajar -->
                    <div class="form-actions">
                        <label class="checkbox-label">
                            <input type="checkbox" id="rememberMe">
                            <span>Ingat saya</span>
                        </label>
                        <button type="submit" class="btn-login">
                             Login
                        </button>
                    </div>

                    <div id="errorMessage" class="error-msg"></div>
                </form>
                </div>
            </div>
        </div>
    </div>

    <script src="/frontend/assets/js/auth.js?v=2"></script>
</body>
</html>
